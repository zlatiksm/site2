<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Мой сайт</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Мой сайт<span>.</span></a>
      <nav aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="about.html">О проекте</a>
        <a class="active" href="contacts.html">Контакты</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <p class="eyebrow">Контакты</p>
    <h1>Давайте <span>общаться.</span></h1>
    <p class="intro">Можешь написать мне через форму или отправить письмо на электронную почту.</p>

    <div class="contact-card">
      <div>
        <p class="contact-label">Электронная почта</p>
        <a class="email" href="mailto:zlatasm5@gmail.com">zlatasm5@gmail.com</a>
      </div>
    </div>

    <section class="form-section">
      <h2>Форма обратной связи</h2>
      <form id="contactForm" novalidate>
        <div class="form-field">
          <label for="name">Имя</label>
          <input class="form-control" type="text" id="name" name="name" placeholder="Как к вам обращаться?" required>
          <small class="field-error" id="nameError"></small>
        </div>
        <div class="form-field">
          <label for="email">Электронная почта</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" required>
          <small class="field-error" id="emailError"></small>
        </div>
        <div class="form-field">
          <label for="message">Сообщение</label>
          <textarea class="form-control" id="message" name="message" rows="5" placeholder="Напишите сообщение..." required></textarea>
          <small class="field-error" id="messageError"></small>
        </div>
        <button class="button" type="submit">Отправить</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      <</form>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <p>© 2026 Злата</p>
      <a href="index.html">На главную ↑</a>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
